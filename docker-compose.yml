version: "3.9"

# FIKRA AI — Local Development Stack
#
# Services:
#   postgres  — PostgreSQL 16 with pgvector
#   redis     — Redis 7 (Celery broker + cache)
#   backend   — FastAPI application
#   worker    — Celery document-ingestion worker
#   frontend  — Next.js development server
#
# Quick start:
#   docker compose up -d postgres redis
#   # then start backend and frontend outside Docker for hot-reload

services:
  # -----------------------------------------------------------------------
  # PostgreSQL + pgvector
  # -----------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fikra_postgres
    environment:
      POSTGRES_DB: rag-prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag-prod"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Redis
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fikra_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # FastAPI Backend
  # -----------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fikra_backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:root@postgres:5432/rag-prod
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    volumes:
      - uploads_data:/app/uploads
      - ./backend:/app  # hot-reload in development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # -----------------------------------------------------------------------
  # Celery Worker
  # -----------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fikra_worker
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:root@postgres:5432/rag-prod
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    volumes:
      - uploads_data:/app/uploads
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info -Q default,ingestion

  # -----------------------------------------------------------------------
  # Next.js Frontend
  # -----------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fikra_frontend
    environment:
      NEXT_PUBLIC_APP_NAME: "FIKRA AI"
      # Backend URL for server-side API calls within Docker network
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  uploads_data:
